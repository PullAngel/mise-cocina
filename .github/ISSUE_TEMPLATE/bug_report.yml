name: Reportar un error
description: Algo no funciona como debería en Mise.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Gracias por ayudarnos a reproducir el problema sin exponer datos privados.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 0.4.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Android APK
        - PWA o navegador
        - Desarrollo local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      description: Incluí el estado inicial, las acciones y lo que ocurrió.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Modelo de teléfono, orientación, captura o receta mínima sin datos privados.
